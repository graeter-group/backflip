debug: False
use_wandb: False
use_tqdm: True

seed: 123
num_devices: 1
warm_start: null
dev_run: False
run_name: ddg_run
run_dir: runs/${experiment.run_name}/${now:%Y-%m-%d_%H-%M-%S}

wandb:
  name: ddg_run
  project: backflip-ddg
  save_dir: outputs/
  tags: []

optimizer:
  lr: 0.0001

ddg_loss: mse # mse | huber
huber_beta: 1.0

trainer:
  overfit_batches: 0
  min_epochs: 1
  max_epochs: 30
  accelerator: gpu
  log_every_n_steps: 1
  deterministic: True
  strategy: ddp
  check_val_every_n_epoch: 1
  default_root_dir: outputs/
  accumulate_grad_batches: 1
  gradient_clip_val: 1.0

checkpointer:
  dirpath: ${experiment.run_dir}/checkpoints
  save_last: True
  filename: "best"
  every_n_epochs: 1
  save_top_k: 1
  monitor: val/rmse
  mode: min
  auto_insert_metric_name: False

early_stopping:
  monitor: val/rmse
  mode: min
  patience: 5
  min_delta: 0.0
