dataset:
  seed: 123
  max_num_res: 512
  cache_num_res: 0
  min_num_res: 60
  subset: null
  flexibility: True
  pick_random_conf: True # only applies to during training set
  num_confs: 100 # number of conformations stored in the dataset
  pick_random_conf_prob: 0.0 # probability of picking a random conformation and not the equilibrium one in pick_random_conf mode
  dataset_type: ATLAS
  allowed_oligomers: [monomeric]
  apply_clustering: False
  filter_scrmsd: inf
  max_coil_pct: 1.0
  train_csv_path: ./alphaflow_train.csv
  val_csv_path: ./alphaflow_val.csv
  test_csv_path: ./alphaflow_test.csv
  csv_path: null # has no effect, just provided for compatibility with non-splitted datasets
  extra_features:
    - global_rmsf
    - per_res_covariance
    - pairwise_couplings
    - pairwise_DCCM

# backwards compatibility
  target_sec_content:
    helix_percent: 0.32
    strand_percent: 0.27
    
loader:
  num_workers: 4
  prefetch_factor: 10

sampler:
  max_batch_size: 150
  max_num_res_squared: 1_000_000
  clustered: ${data.dataset.apply_clustering}